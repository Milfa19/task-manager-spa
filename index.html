<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <title>Task Manager</title>

  <style>
    body {
      margin: 0;
      font-family: Arial;
      background: #f4f4f4;
    }

    .container {
      display: flex;
      min-height: 100vh;
    }

    /* LEFT */
    .sidebar {
      width: 300px;
      background: white;
      padding: 20px;
      border-right: 1px solid #ddd;
    }

    input, textarea {
      width: 100%;
      margin-bottom: 10px;
      padding: 8px;
    }

    button {
      padding: 10px;
      cursor: pointer;
      border: none;
      background: #007bff;
      color: white;
    }

    /* RIGHT */
    .content {
      flex: 1;
      padding: 20px;
    }

    .filters {
      margin-bottom: 20px;
    }

    .filters button {
      margin-right: 5px;
      background: #eee;
      color: black;
    }

    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(250px, 1fr));
      gap: 15px;
    }

    .card {
      background: white;
      padding: 15px;
      border-radius: 8px;
      box-shadow: 0 3px 10px rgba(0,0,0,0.1);
    }

    .tag {
      font-size: 12px;
      background: #007bff;
      color: white;
      padding: 3px 6px;
      border-radius: 4px;
      display: inline-block;
      margin-bottom: 5px;
    }

    .delete {
      margin-top: 10px;
      background: red;
    }

    /* MOBILE */
    @media (max-width: 768px) {
      .container {
        flex-direction: column;
      }

      .sidebar {
        width: 100%;
      }
    }
  </style>
</head>
<body>

<div class="container">

  <!-- LEFT -->
  <div class="sidebar">
    <h2>Новая задача</h2>

    <input id="title" placeholder="Название">
    <input id="stack" placeholder="Стек (например: JS)">
    <textarea id="description" placeholder="Описание"></textarea>

    <button onclick="createTask()">Создать задачу</button>
  </div>

  <!-- RIGHT -->
  <div class="content">

    <div class="filters">
      <button onclick="setFilter('all')">Все</button>
      <button onclick="setFilter('Python')">Python</button>
      <button onclick="setFilter('Web')">Web</button>
      <button onclick="setFilter('Дизайн')">Дизайн</button>
    </div>

    <div class="grid" id="taskList"></div>

  </div>
</div>

<script>
  let tasks = JSON.parse(localStorage.getItem('tasks')) || [];
  let currentFilter = 'all';

  function save() {
    localStorage.setItem('tasks', JSON.stringify(tasks));
  }

  function createTask() {
    const title = document.getElementById('title').value.trim();
    const stack = document.getElementById('stack').value.trim();
    const description = document.getElementById('description').value.trim();

    if (!title || !stack) {
      alert('Заполни название и стек');
      return;
    }

    const newTask = {
      id: Date.now(),
      title,
      stack,
      description
    };

    tasks.push(newTask);
    save();
    render();

    document.getElementById('title').value = '';
    document.getElementById('stack').value = '';
    document.getElementById('description').value = '';
  }

  function deleteTask(id) {
    tasks = tasks.filter(t => t.id !== id);
    save();
    render();
  }

  function setFilter(filter) {
    currentFilter = filter;
    render();
  }

  function getFilteredTasks() {
    if (currentFilter === 'all') return tasks;
    return tasks.filter(t =>
      t.stack.toLowerCase().includes(currentFilter.toLowerCase())
    );
  }

  function render() {
    const container = document.getElementById('taskList');
    container.innerHTML = '';

    const filtered = getFilteredTasks();

    filtered.forEach(task => {
      const card = document.createElement('div');
      card.className = 'card';

      card.innerHTML = `
        <div class="tag">${task.stack}</div>
        <h3>${task.title}</h3>
        <p>${task.description}</p>
        <button class="delete" onclick="deleteTask(${task.id})">Удалить</button>
      `;

      container.appendChild(card);
    });
  }

  render();
</script>

</body>
</html>
